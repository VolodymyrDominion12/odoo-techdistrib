# =============================================================================
#  ruff.toml — швидкий лінтер для кастомних аддонів Odoo
# =============================================================================
#  ВАЖЛИВО ПЕРЕД ЗАПУСКОМ `ruff check --fix`:
#
#  Сирий ruff на Odoo-аддоні робить ДВІ руйнівні речі:
#
#    1. Видаляє `from . import models` з __init__.py (правило F401 «unused
#       import»). Для Python це справді «невикористаний імпорт», але для Odoo
#       це ЄДИНИЙ спосіб зареєструвати моделі. Після автоправки модуль
#       встановиться без жодної моделі й без жодної помилки — тихий,
#       найгірший різновид поломки.
#
#    2. Переписує `_('...%s...')` у f-strings (правило UP031). Для Python це
#       модернізація, для перекладів — регресія: f-string обчислюється ДО
#       виклику `_()`, тому в .po-файл потрапляє вже готова строка, і
#       перекладач її більше ніколи не побачить.
#
#  Обидва правила нижче вимкнені свідомо. Це не «ліниво»: у теці vendor/odoo
#  той самий код, і саме так його пише сама Odoo.
# =============================================================================

line-length = 100
target-version = "py312"

extend-exclude = [
    "vendor",
    ".venv",
    ".venv-mcp",
    ".venv-lint",
    "__pycache__",
]

[lint]
# Набір свідомо вужчий за «увімкнути все»: у Odoo зайві правила дають
# більше хибних спрацьовувань, ніж користі.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes — реальні помилки: неіснуючі імена, дублікати, f-string без місць
    "I",   # isort — порядок імпортів (збігається з конвенцією OCA)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear — класичні пастки Python
    "C4",  # comprehensions
    "SIM", # спрощення
    "RUF", # правила самого ruff
]

ignore = [
    # --- Конвенції цього проєкту ---
    # `# -*- coding: utf-8 -*-` у кожному файлі: у Python 3 не потрібен,
    # але це наскрізний стиль проєкту, і він нічому не шкодить.
    "UP009",

    # --- Конфлікти з Odoo (див. шапку файлу) ---
    "UP031",   # %-форматування ОБОВ'ЯЗКОВЕ всередині _()
    "RUF012",  # змінні атрибути класу — це ідіома метакласу Odoo
               # (_inherit, _order, _sql_constraints задають списками)

    # --- Хибні спрацьовування ---
    "B018",    # __manifest__.py — це голий літерал словника, так і задумано
    "RUF059",  # невикористані розпаковані змінні в тестах: часто навмисно
    "SIM117",  # вкладені `with` інколи читаються краще за об'єднаний

    # --- Кирилиця в коментарях і рядках ---
    # RUF001/002/003 шукають «неоднозначні» символи Unicode: кириличні
    # а, е, о, с, р, х, і схожі на латинські. Для проєкту, де коментарі,
    # docstring-и й повідомлення користувачу написані УКРАЇНСЬКОЮ, це
    # спрацьовує майже на кожному рядку: на цьому коді — 1549 із 1570
    # початкових зауважень. Правило має сенс для коду, де змішування
    # алфавітів є помилкою; тут воно просто заважає бачити справжні знахідки.
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
# `from . import models` — це API реєстрації модулів Odoo, а не сміття.
"__init__.py" = ["F401"]
"**/__init__.py" = ["F401"]
# Маніфест — дані, а не код: довгі рядки в description нормальні.
"**/__manifest__.py" = ["E501", "B018"]
# У тестах дозволяємо довгі літерали очікувань і «магію» підготовки даних.
"**/tests/**" = ["E501", "RUF059"]

[lint.isort]
# odoo — не наш код і не stdlib: ставимо його в третю групу.
known-third-party = ["odoo"]
# Порядок `from odoo import _, api, fields, models` — конвенція OCA.
force-sort-within-sections = false
