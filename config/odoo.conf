; =============================================================================
;  odoo.conf — конфігурація сервера Odoo 18 для проєкту TechDistrib
; =============================================================================
;  Odoo читає цей файл, якщо запущений з параметром  -c config/odoo.conf
;  Будь-який параметр звідси можна перебити прапорцем у командному рядку,
;  наприклад:  -c config/odoo.conf -d techdistrib --log-level=debug
;
;  ВАЖЛИВО ПРО ШЛЯХИ:
;  Відносні шляхи в odoo.conf Odoo рахує від РОБОЧОЇ ДИРЕКТОРІЇ процесу,
;  а не від розташування самого файлу. Щоб не залежати від того, звідки
;  ти запустив сервер, тут усі шляхи абсолютні.
; =============================================================================

[options]

; --- Де Odoo шукає модулі -----------------------------------------------------
; Це СПИСОК директорій через кому. Порядок має значення: якщо в двох місцях
; лежить модуль з однаковою технічною назвою, переможе той, що ЛІВІШЕ.
;   vendor/odoo/addons  — стандартні модулі Odoo (продажі, склад, закупівлі...)
;   vendor/odoo/odoo/addons — технічні модулі ядра (base, web, mail)
;   custom_addons       — НАШІ модулі. Саме сюди ми писатимемо код.
addons_path = /home/volodymyr/PycharmProjects/odoo-techdistrib/vendor/odoo/addons,/home/volodymyr/PycharmProjects/odoo-techdistrib/vendor/odoo/odoo/addons,/home/volodymyr/PycharmProjects/odoo-techdistrib/custom_addons

; --- Де Odoo зберігає «файлове сховище» ---------------------------------------
; У Postgres лежать лише метадані. Самі файли (PDF-звіти, вкладення, аватарки,
; картинки товарів) лежать на диску в filestore/<ім'я_бази>/.
data_dir = /home/volodymyr/PycharmProjects/odoo-techdistrib/data

; --- Підключення до PostgreSQL ------------------------------------------------
; Порт 5437 — це порт, який ми опублікували в docker-compose.yml
db_host = 127.0.0.1
db_port = 5437
db_user = odoo
db_password = odoo
; База за замовчуванням. Якщо її ще немає — Odoo створить її при першому старті
; (за умови, що вище стоїть dbfilter або переданий -d).
db_name = techdistrib

; --- Веб-сервер ---------------------------------------------------------------
http_port = 8069
; Пароль супер-адміністратора БАЗИ (не плутати з логіном admin у вебі!).
; Потрібен для операцій рівня сервера: створення/видалення/бекап баз.
; У продакшені це має бути довгий випадковий рядок, а не 'admin'.
admin_passwd = admin
; Показувати список баз на сторінці входу. Зручно для навчання.
list_db = True

; --- Режим розробника ---------------------------------------------------------
; Це «чарівний» параметр, який робить навчання в рази швидшим:
;   reload   — сервер сам перезапускається, коли ти змінив .py файл
;   qweb     — шаблони .xml перечитуються з диска без перезапуску
;   werkzeug — у браузері показується traceback помилки замість «Internal Error»
;   xml      — довші й зрозуміліші помилки при розборі XML-файлів
;   assets   — JS/CSS-бандли перебудовуються на кожен запит (повільніше, але
;              ти завжди бачиш свої зміни; у продакшені це ВИМИКАЮТЬ)
dev = reload,qweb,werkzeug,xml,assets

; --- Логування ----------------------------------------------------------------
log_level = info
; logfile = /home/volodymyr/PycharmProjects/odoo-techdistrib/data/odoo.log

; --- Продуктивність -----------------------------------------------------------
; workers = 0 означає «багатопотоковий режим без окремих процесів».
; Це обов'язково для розробки: у багатопроцесному режимі (workers > 0) твій
; breakpoint у PyCharm працює непередбачувано, а --dev=reload не діє.
workers = 0
; Обмеження пам'яті на воркер — тут неактуальне, але лишаємо як пам'ятку.
limit_memory_soft = 2147483648
